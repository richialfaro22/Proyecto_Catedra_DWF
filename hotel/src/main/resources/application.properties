spring.application.name=hotel
server.port=8080

# Base de datos
spring.datasource.url=jdbc:mariadb://localhost:3306/hotel_db
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT
jwt.secret=bWlfY2xhdmVfc2VjcmV0YV9tdXlfbGFyZ2FfZGVfYWxfbWVub3NfMzJfYnl0ZXNfMTIzNDU2
# 8 horas
jwt.expiration=28800000

# CORS: origenes del frontend (Vue/Vite)
app.cors.origenes=http://localhost:5173,http://127.0.0.1:5173

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
